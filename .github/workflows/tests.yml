name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build modules
        run: pio run -e native

      - name: Run unit tests
        run: pio test -e native
