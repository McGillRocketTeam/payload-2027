; Payload Software 2027
;
; Layout follows flightComputer-2027: one top-level platformio.ini, src_dir at
; the repo root, and each environment picks its sources with build_src_filter.
;
; Only the native (laptop) environment exists for now. The flight-board
; environment is added once the MCU is chosen; see the template at the bottom
; and docs/setup.md.

[platformio]
    default_envs = native
    src_dir = .

[common]
    ; Flags shared by every environment.
    build_flags =
        -std=gnu11
        -g3
        -Wall
        -Wextra
        -ffunction-sections
        -fdata-sections

[common_stm32]
    ; Flags only valid for the ARM toolchain. Not used until a board env exists.
    ; Note: FC lists both -O0 and -Os, so the later -Os silently wins. Pick one.
    build_flags =
        ${common.build_flags}
        -Os
        -fstack-usage
        --specs=nano.specs
        -DSTM32

[env:native]
    ; Builds modules/ on the host so drivers can be unit tested without a board.
    ; Run with: pio test -e native
    platform = native
    test_framework = unity
    test_build_src = yes

    build_src_filter =
        -<*>
        +<modules/**>
        +<host/**>               ; main() for `pio run`; skipped in test builds

    build_flags =
        ${common.build_flags}
        -I modules

